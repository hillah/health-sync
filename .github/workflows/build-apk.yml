name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされたときに実行
  workflow_dispatch: # GitHub Web画面から手動実行可能

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # GitHub Release 作成権限

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 17 のセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Gradle のセットアップ (キャッシュ有効化)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Gradle wrapper の実行権限付与 (存在する場合)
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # 5. Release APK のビルド
      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      # 6. APK の署名 (GitHub Secrets に署名鍵が登録されている場合)
      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          # 1. Base64 からキーストアファイルを復元
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # 2. 最新の Android Build-Tools を自動検出
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 3. 未署名 APK の検出
          cd app/build/outputs/apk/release
          SRC_APK=$(ls app-*-unsigned.apk 2>/dev/null || ls app-*.apk | head -n 1)
          echo "Target APK: $SRC_APK"

          # 4. zipalign (4バイトアラインメント調整)
          $BUILD_TOOLS_DIR/zipalign -v -p -f 4 "$SRC_APK" app-aligned.apk

          # 5. apksigner による V2/V3 署名
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out HealthSync-release.apk app-aligned.apk

          # 6. 一時キーストアの削除
          rm -f "$GITHUB_WORKSPACE/release.keystore"
          echo "Successfully signed HealthSync-release.apk"

      # 7. ビルド成果物の保存 (Actions 画面から直接ダウンロード可能)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthSync-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 8. GitHub Releases への自動公開 (タグプッシュ時のみ)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
